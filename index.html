a{color:var(--ink)}

.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;padding-block:64px 44px}
.hero > *{min-width:0}

.facts span{font-size:.84rem;color:var(--muted)}

section{padding-block:60px}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 14px;cursor:pointer;font-size:.88rem}

.pic img,.pic svg{display:block;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:12px;left:12px;background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px}

.empty{color:var(--muted);padding:30px 0}

.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}
.step{border-top:1px solid var(--brass);padding-top:14px}
.step .n{font-family:var(--mono);font-size:.78rem;color:var(--brass)}
.step h3{font-size:1.2rem;margin:6px 0}
.step p{margin:0;font-size:.92rem;color:var(--muted)}
.step code{font-family:var(--mono);font-size:.85em;background:var(--soft);padding:1px 5px}

.about{display:grid;grid-template-columns:.75fr 1.25fr;gap:56px;align-items:center}
.about > *{min-width:0}
.portrait{aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;max-width:340px;width:100%;border:1px solid var(--line);overflow:hidden}

.portrait span{font-family:var(--display);font-size:5.5rem;color:var(--brass)}

.about ul{padding-left:18px;color:var(--muted)}

.contact{background:var(--ink);color:var(--on-ink);padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:44px}

.contact h2{color:var(--on-ink)}
.contact p{opacity:.85}
.cline{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--on-ink) 25%,transparent);flex-wrap:wrap}
.cline span{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.cline b{font-weight:500;user-select:all;word-break:break-all;font-variant-numeric:tabular-nums}
.cline a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;font-size:.8rem}
form{display:flex;flex-direction:column;gap:12px}
form label{font-size:.84rem;opacity:.85}
form input,form textarea,form select{width:100%;background:color-mix(in srgb,var(--on-ink) 8%,transparent);border:1px solid color-mix(in srgb,var(--on-ink) 30%,transparent);padding:10px 12px;color:var(--on-ink)}
form select option{color:#0E1B2C;background:#FFFFFF}
form textarea{min-height:90px;resize:vertical}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--ink);align-self:flex-start}
.done{background:color-mix(in srgb,var(--on-ink) 10%,transparent);padding:16px}
.done pre{white-space:pre-wrap;font-family:var(--body);margin:8px 0 12px;font-size:.92rem}

footer{padding-block:30px 44px;color:var(--muted);font-size:.84rem;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

.gal img,.gal svg{display:block;width:100%;height:100%;object-fit:cover}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:rgba(14,27,44,.7);color:#F2F2F0;cursor:pointer;font-size:1.2rem}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .count{bottom:12px;right:12px}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.3rem;z-index:2}
.m-body{padding:26px 28px 30px}
.m-specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}

/* данные объектов — в listings.js */

/* drawn fallback when a photo can't load */
function scene(type, w, h, seed){
  const hy=h*.58, bx=w*(.16+((seed*37)%28)/100), bw=w*.42, bh=h*.3;
  const roof = type==="house"
    ? `<polygon points="${bx-10},${hy-bh} ${bx+bw/2},${hy-bh-h*.12} ${bx+bw+10},${hy-bh}" fill="#9C5B3E"/>`
    : `<rect x="${bx-6}" y="${hy-bh-8}" width="${bw+12}" height="10" fill="#D9D4C8"/>`;
  let wins=""; const cols=type==="villa"?4:3;
  for(let i=0;i<cols;i++) wins+=`<rect x="${bx+14+i*(bw-28)/cols}" y="${hy-bh+16}" width="${(bw-28)/cols-10}" height="${bh*.32}" fill="#243B52" opacity=".85"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="sk${seed}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--sky1)"/><stop offset="1" stop-color="var(--sky2)"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#sk${seed})"/>
    <circle cx="${w*.8}" cy="${h*.18}" r="${h*.06}" fill="#E8D3A2"/>
    <path d="M0 ${hy-18} Q ${w*.25} ${hy-48} ${w*.5} ${hy-22} T ${w} ${hy-30} V ${hy} H0Z" fill="var(--hill)" opacity=".55"/>
    <rect x="0" y="${hy}" width="${w}" height="${h-hy}" fill="var(--sea)"/>
    <rect x="0" y="${hy+(h-hy)*.55}" width="${w}" height="${h-hy}" fill="var(--sea2)"/>
    <rect x="0" y="${hy-6}" width="${w}" height="8" fill="#DCD3BE"/>
    <rect x="${bx}" y="${hy-bh}" width="${bw}" height="${bh}" fill="#F7F7F4" stroke="rgba(0,0,0,.08)"/>
    ${roof}${wins}<rect x="${bx+bw*.42}" y="${hy-bh*.42}" width="${bw*.16}" height="${bh*.42}" fill="#243B52"/>
  </svg>`;
}
function photo(p, i, w, h){
  const src = p.photos[i] ? IMG + p.photos[i] + ".webp" : "";
  const fb = encodeURIComponent(scene(p.type, w, h, p.code % 97 + i));
  return src ? `<img src="${src}" alt="" loading="lazy" onerror="this.outerHTML=decodeURIComponent('${fb}')">` : scene(p.type, w, h, p.code % 97 + i);
}

const $ = s => document.querySelector(s);
let lang = "bg", place = "all", type = "all";
(function initLang(){
  const h = location.hash.replace("#","");
  if (LANGS.includes(h)) { lang = h; return; }
  try { const s = localStorage.getItem("vh-lang"); if (LANGS.includes(s)) { lang = s; return; } } catch(e){}
  const nav = (navigator.language||"").slice(0,2);
  if (LANGS.includes(nav)) lang = nav;
})();
const money = n => new Intl.NumberFormat(LOCALE[lang]).format(n) + " €";
const seaText = (p,t) => p.sea===0 ? t.seafront : p.sea>=1000 ? (p.sea/1000)+" "+t.km : p.sea+" m";

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.name + " · Imoti Premier";
  document.querySelectorAll("[data-i]").forEach(el=>{
    const v = t[el.dataset.i]; if (v==null) return;
    if (el.hasAttribute("data-html")) el.innerHTML = v; else el.textContent = v;
  });
  $("#langs").innerHTML = LANGS.map(l=>`<button data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("");
  $("#factCount").textContent = LISTINGS.length;
  $("#updated").textContent = t.updated + ": " + new Date(UPDATED).toLocaleDateString(LOCALE[lang]);

  const places = [...new Set(LISTINGS.map(p=>p.place))];
  const types = [...new Set(LISTINGS.map(p=>p.type))];
  $("#filters").innerHTML = [["all",t.all],...places.map(k=>[k,PLACES[k][lang]])]
    .map(([k,l])=>`<button class="chip" data-place="${k}" aria-pressed="${place===k}">${l}</button>`).join("")
    + `<select id="type-select" aria-label="type"><option value="all">${t.typeAll}</option>${types.map(k=>`<option value="${k}">${t[k]}</option>`).join("")}</select>`;
  $("#type-select").value = type;

  const list = LISTINGS.filter(p=>(place==="all"||p.place===place)&&(type==="all"||p.type===type));
  $("#grid").innerHTML = list.length ? list.map(p=>`
    <button class="card" data-code="${p.code}">
      <div class="pic">${photo(p,0,600,400)}<span class="tag">${t[p.type]}</span><span class="count">${p.photos.length} ${t.photos}</span></div>
      <div class="body">
        <div class="loc">${PLACES[p.place][lang]} · ${p.code}</div>
        <h3>${p.title[lang]}</h3>
        <div class="price">${money(p.price)}</div>
        <div class="specs"><span>${p.area} м²</span>${p.bedrooms?`<span>${t.bedrooms}: ${p.bedrooms}</span>`:""}${p.sea!=null?`<span>${t.sea}: ${seaText(p,t)}</span>`:""}${p.floor?`<span>${t.floor}: ${p.floor}</span>`:""}</div>
      </div>
    </button>`).join("") : `<p class="empty">${t.none}</p>`;

  $("#steps").innerHTML = t.steps.map((s,i)=>`<div class="step"><div class="n">0${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
  $("#aboutList").innerHTML = t.aboutList.map(x=>`<li>${x}</li>`).join("");
  const sel = $("#f-obj"), cur = sel.value;
  sel.innerHTML = `<option value="">${t.anyObj}</option>` + LISTINGS.map(p=>`<option value="${p.code}">${p.code} · ${p.title[lang]}</option>`).join("");
  sel.value = cur || "";
}

$("#heroArt").innerHTML = LISTINGS.length ? photo(LISTINGS[0], 0, 400, 500) : scene("villa", 400, 500, 7);
(function(){ const img=new Image(); img.onload=()=>{ $("#portrait").innerHTML=""; $("#portrait").appendChild(img); };
  img.alt=""; img.src="https://imotipremier.com/webfactor-images/venera-hasanova-broker-na-nedvijimi-imoti1221828-522x642-top-1221828.webp"; })();

document.addEventListener("click", e=>{
  const lb = e.target.closest("#langs button");
  if (lb){ lang = lb.dataset.lang; try{localStorage.setItem("vh-lang",lang)}catch(_){}; track("language",{lang}); render(); return; }
  const chip = e.target.closest(".chip");
  if (chip){ place = chip.dataset.place; render(); return; }
  const card = e.target.closest(".card");
  if (card) openModal(+card.dataset.code);
});
document.addEventListener("change", e=>{ if (e.target.id==="type-select"){ type=e.target.value; render(); } });

const modal = $("#modal"); let cur = null, idx = 0;
function showPhoto(){ $("#galImg").innerHTML = photo(cur, idx, 900, 600); $("#gCount").textContent = (idx+1)+" / "+cur.photos.length; const many=cur.photos.length>1; $("#gPrev").hidden=!many; $("#gNext").hidden=!many; }
function openModal(code){
  const t = T[lang]; cur = LISTINGS.find(p=>p.code===code); idx = 0;
  showPhoto();
  $("#mLoc").textContent = `${t[cur.type]} · ${PLACES[cur.place][lang]}`;
  $("#mTitle").textContent = cur.title[lang];
  $("#mPrice").textContent = money(cur.price);
  const specs = [[t.area, cur.area+" м²"]];
  if (cur.bedrooms) specs.push([t.bedrooms, cur.bedrooms]);
  if (cur.floor) specs.push([t.floor, cur.floor]);
  if (cur.sea!=null) specs.push([t.sea, seaText(cur,t)]);
  specs.push(["€/м²", new Intl.NumberFormat(LOCALE[lang]).format(Math.round(cur.price/cur.area))]);
  $("#mSpecs").innerHTML = specs.slice(0,4).map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("");
  $("#mDesc").textContent = cur.desc[lang];
  $("#mFeat").innerHTML = (cur.feat[lang]||[]).map(f=>`<li>${f}</li>`).join("");
  const a = $("#mAsk"); a.textContent = t.ask;
  a.onclick = ()=>{ $("#f-obj").value = cur.code; modal.close(); track("ask_property",{code:cur.code}); };
  const s = $("#mSrc"); s.href = cur.url; s.textContent = `${t.source} ${cur.code} ↗`;
  track("view_property",{code:code});
  modal.showModal();
}
$("#gPrev").onclick = ()=>{ idx = (idx-1+cur.photos.length)%cur.photos.length; showPhoto(); };
$("#gNext").onclick = ()=>{ idx = (idx+1)%cur.photos.length; showPhoto(); };
$("#mClose").onclick = ()=>modal.close();
modal.addEventListener("click", e=>{ if (e.target===modal) modal.close(); });
document.addEventListener("keydown", e=>{ if(!modal.open) return; if(e.key==="ArrowRight") $("#gNext").click(); if(e.key==="ArrowLeft") $("#gPrev").click(); });

$("#form").addEventListener("submit", e=>{
  e.preventDefault();
  const t = T[lang], code = $("#f-obj").value, p = LISTINGS.find(x=>String(x.code)===code);
  const txt = `${t.fName}: ${$("#f-name").value}\n${t.fPhone}: ${$("#f-phone").value}\n${t.fObj}: ${p ? p.code+" · "+p.title[lang]+" · "+money(p.price) : t.anyObj}\n${t.fMsg} ${$("#f-msg").value}`;
  $("#doneText").textContent = txt; $("#done").hidden = false; track("lead_prepared",{code:code||"general"});
});
$("#copy").addEventListener("click", ()=>{
  const b = $("#copy");
  navigator.clipboard.writeText($("#doneText").textContent).then(()=>{ b.textContent = T[lang].copied; }, ()=>{
    const r=document.createRange(); r.selectNodeContents($("#doneText")); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});

render();
</script>
