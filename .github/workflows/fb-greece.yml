name: Facebook «Veni Homes - Имоти в Гърция» (болгарский, по расписанию)

# Пн/Ср/Пт 09:00 — статья блога; Вт/Чт 09:00 — объект; каждый день 19:00 — объект (время Софии).
# GitHub часто пропускает и задерживает запуски, поэтому крон стоит каждые 20 минут (UTC);
# пропущенный пост публикуется при следующем удачном запуске в тот же день;
# скрипт сам решает, пора ли публиковать, и не публикует один слот дважды.
on:
  schedule:
    - cron: "13,33,53 5-11 * * *"
    - cron: "13,33,53 15-21 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "Опубликовать сейчас: listing (объект) или blog (статья). Пусто — по расписанию"
        required: false
        default: ""
      dry:
        description: "Пробный запуск без публикации (1)"
        required: false
        default: "0"

concurrency:
  group: site-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать
        env:
          FB_GR_PAGE_ID: "1412346291953560"
          FB_GR_PAGE_TOKEN: ${{ secrets.FB_GR_PAGE_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry }}" = "1" ]; then ARGS="$ARGS --dry"; fi
          if [ -n "${{ github.event.inputs.what }}" ]; then ARGS="$ARGS --force ${{ github.event.inputs.what }}"; fi
          python3 .github/scripts/fb_greece.py $ARGS
      - name: Сохранить, что уже вышло
        if: always()
        run: |
          git config user.name "VENI bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fb_greece_state.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Facebook Гърция: опубликован пост [no-announce]"; git pull --rebase && git push; }
