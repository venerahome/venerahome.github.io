name: Очередь KATOIKO → Telegram (раз в день, 17:00 по Софии)

# Публикует по одному объекту из data/announce_queue_katoiko.json в Telegram-канал раз в день.
# GitHub часто запускает расписание с опозданием, поэтому крон стоит на несколько часов подряд:
# публикуем при первом запуске после 17:00 по Софии, если сегодня ещё ничего не публиковали.
on:
  schedule:
    - cron: "5 14,15,16,17,18,19 * * *"
  workflow_dispatch:

concurrency:
  group: site-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить время (София)
        id: slot
        run: |
          H=$(TZ=Europe/Sofia date +%-H); DAY=$(TZ=Europe/Sofia date +%Y-%m-%d)
          LAST=$(python3 -c "import json;print(json.load(open('data/announce_queue_katoiko.json')).get('last_slot',''))")
          LEFT=$(python3 -c "import json;print(len(json.load(open('data/announce_queue_katoiko.json'))['queue']))")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$DAY" != "$LAST" ] && [ "$LEFT" != "0" ]; then GO=1
          elif [ "$H" -ge 17 ] && [ "$DAY" != "$LAST" ] && [ "$LEFT" != "0" ]; then GO=1; else GO=0; fi
          echo "go=$GO" >> $GITHUB_OUTPUT; echo "slot=$DAY" >> $GITHUB_OUTPUT
          echo "Час в Софии: $H, день $DAY, последний $LAST, в очереди $LEFT → публикую: $GO"
      - name: Опубликовать один объект в Telegram
        if: steps.slot.outputs.go == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Нет ключей Telegram — ничего не публикую"; exit 1; fi
          python3 .github/scripts/announce_listings.py --queue data/announce_queue_katoiko.json
      - name: Сохранить очередь
        if: steps.slot.outputs.go == '1'
        run: |
          git config user.name "VENI bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/announce_queue_katoiko.json
          git diff --cached --quiet || { git commit -m "Очередь KATOIKO: опубликован объект в Telegram [no-announce]"; git pull --rebase && git push; }
